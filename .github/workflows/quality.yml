name: CI - Code Quality

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm type-check

      # Unit tests only — the integration suite (tests/int) needs a live local
      # D1 binding via the wrangler proxy, which CI doesn't provision.
      - run: pnpm test:unit
